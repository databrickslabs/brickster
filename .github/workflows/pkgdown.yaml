# Workflow derived from https://github.com/r-lib/actions/tree/master/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  release:
    types: [published]
  workflow_dispatch:

name: pkgdown

permissions:
  contents: read

jobs:
  pkgdown:
    permissions:
      contents: write # Deploy pkgdown output to the gh-pages branch.
    # This protected runner is acceptable only for privileged triggers above
    # (push to protected branches, release publication, or manual dispatch).
    # Do not add pull_request, issue_comment, or other untrusted triggers here.
    runs-on:
      group: databrickslabs-protected-runner-group
      labels: linux-ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: r-lib/actions/setup-pandoc@465b7d8e732ca3921382b1674c59bada9cbf3399 # v2.13.0

      - uses: r-lib/actions/setup-r@465b7d8e732ca3921382b1674c59bada9cbf3399 # v2.13.0
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@465b7d8e732ca3921382b1674c59bada9cbf3399 # v2.13.0
        env:
          GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Keep pkgdown matched to the cache bundled by pkgdown.offline.
          extra-packages: any::pkgdown@2.2.1, any::pkgdown.offline@0.1.3, local::.
          needs: website

      - name: Restore bundled website assets
        run: Rscript -e 'pkgdown.offline::init_site()'

      - name: Deploy package
        env:
          GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --local user.name "$GITHUB_ACTOR"
          git config --local user.email "$GITHUB_ACTOR@users.noreply.github.com"
          Rscript -e 'pkgdown::deploy_to_branch(new_process = FALSE)'
